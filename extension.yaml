{
  "manifest_version": 2,
  "extension_id": "flowsteward.supabase",
  "kind": "tool_provider",
  "version": "1.0.4",
  "release_stage": "active",
  "display_name": "Supabase",
  "description": "Automate Supabase table records from Flow Steward without writing a custom HTTP integration. List rows with column selection, filters, a limit and an offset; insert batches; upsert against explicit conflict columns; or update and delete rows selected by filters. The extension uses Supabase’s PostgREST table API and supports comparison, membership, null/boolean and LIKE filters. Nested JSON column values remain JSON.\n\nFor example, read new requests from a table, enrich them with another workflow step, then upsert a result by its unique external identifier. Update an approval status using a record ID filter, or delete matching records as part of an authorized cleanup workflow. Inserts and upserts accept up to 100 rows with matching column sets; upserts require the chosen conflict columns to be present and nonnull.\n\nConfigure a hosted Supabase project reference, schema and API key, with an optional access-token JWT. The selected credentials determine table access and row-level security; service-role credentials can bypass those policies. Update and delete require filters, but those filters can still match many rows. The extension covers table records rather than Storage, Auth administration, SQL, RPC, webhooks or realtime subscriptions.",
  "lifecycle": {
    "data_schema_version": 1,
    "data_migrations": []
  },
  "vendor": {
    "name": "Flow Steward"
  },
  "listing": {
    "category": "data",
    "tags": [
      "supabase",
      "database",
      "rest"
    ],
    "summary": "List, insert, upsert, update and delete Supabase table rows through workflow steps with filters and selected columns.",
    "setup_summary": "Create a project Supabase connection with the hosted project reference, optional schema and secret API key; add an access-token JWT when the workflow requires that identity. Ensure the schema/table is exposed through the Data API and the chosen credentials and row-level security policies permit the intended operations."
  },
  "features": [
    "tool",
    "action"
  ],
  "required_scopes": [
    "extension:invoke"
  ],
  "egress": {
    "connection_fields": [
      "supabase.project_ref"
    ]
  },
  "account_scope": {
    "scope_type": "project",
    "description": "Explicit project database connection."
  },
  "entrypoint": {
    "mode": "subprocess",
    "command": [
      "python3",
      "main.py"
    ],
    "timeout_seconds": 40
  },
  "health": {
    "command": [
      "python3",
      "health.py"
    ],
    "timeout_seconds": 5
  },
  "ui_manifest": "ui/ui_manifest.yaml",
  "action_manifest": "ui/actions/actions.yaml",
  "python_requirements": [],
  "runtime": {
    "contract_version": "extension_host_v2",
    "compatibility": {
      "platform_min": "1.4.0"
    },
    "extension_contract_v2": {
      "connection_types": "contracts/connection_types.yaml",
      "operation_manifest": "contracts/operation_manifest.yaml",
      "step_ui_manifest": "contracts/step_ui_manifest.yaml"
    }
  },
  "external_effects": [
    {
      "operation_id": "delete_rows",
      "effect_kind": "database_write",
      "channel": "supabase",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    },
    {
      "operation_id": "insert_rows",
      "effect_kind": "database_write",
      "channel": "supabase",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    },
    {
      "operation_id": "update_rows",
      "effect_kind": "database_write",
      "channel": "supabase",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    },
    {
      "operation_id": "upsert_rows",
      "effect_kind": "database_write",
      "channel": "supabase",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    }
  ],
  "machine_auth": {
    "service_account_key": "svc_ext_supabase",
    "required_scopes": [
      "extension:invoke"
    ]
  }
}
