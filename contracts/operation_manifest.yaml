{
  "operations": [
    {
      "operation_id": "list_rows",
      "display_name": "Read filtered table rows",
      "description": "Read up to 100 Supabase rows with optional column selection and filters. Use an offset for another page; access follows the connection credentials and database policies.",
      "operation_kind": "action",
      "workflow_visible": true,
      "connection_type_ids": [
        "supabase"
      ],
      "category": "data",
      "inputs": [
        {
          "name": "connection_ref",
          "value_type": "connection_ref",
          "required": true,
          "display_name": "Project connection"
        },
        {
          "name": "table",
          "value_type": "text",
          "required": true,
          "display_name": "Table name",
          "schema": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          }
        },
        {
          "name": "filters",
          "value_type": "json",
          "required": false,
          "display_name": "Row filters (JSON)",
          "schema": {
            "type": "array",
            "maxItems": 20,
            "items": {
              "type": "object"
            }
          }
        },
        {
          "name": "select",
          "value_type": "json",
          "required": false,
          "display_name": "Columns to return (JSON)",
          "schema": {
            "type": "array",
            "minItems": 1,
            "maxItems": 64,
            "items": {
              "type": "string",
              "minLength": 1,
              "maxLength": 128
            }
          }
        },
        {
          "name": "limit",
          "value_type": "integer",
          "required": false,
          "display_name": "Maximum results",
          "schema": {
            "type": "integer",
            "minimum": 1,
            "maximum": 100,
            "default": 100
          }
        },
        {
          "name": "offset",
          "value_type": "integer",
          "required": false,
          "display_name": "Rows to skip",
          "schema": {
            "type": "integer",
            "minimum": 0,
            "maximum": 1000000,
            "default": 0
          }
        }
      ],
      "outputs": [
        {
          "name": "rows",
          "value_type": "json"
        },
        {
          "name": "count",
          "value_type": "integer"
        }
      ],
      "result_fields": [
        "result.rows",
        "result.count"
      ],
      "error_codes": [
        "invalid_payload",
        "invalid_connection",
        "effect_claim_required",
        "test_mode_suppressed",
        "provider_unavailable",
        "invalid_provider_response",
        "response_too_large",
        "network_blocked",
        "timeout",
        "authentication_failed",
        "not_found",
        "conflict",
        "rate_limited"
      ]
    },
