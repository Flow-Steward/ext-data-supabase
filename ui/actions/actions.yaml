{
  "actions": [
    {
      "action_id": "list_rows",
      "workflow_visible": true,
      "title": "Read filtered table rows",
      "description": "Read up to 100 Supabase rows with optional column selection and filters. Use an offset for another page; access follows the connection credentials and database policies.",
      "required_scopes": [
        "extension:invoke"
      ],
      "handler": {
        "mode": "extension"
      },
      "parameters": [
        {
          "name": "connection_ref",
          "type": "string",
          "required": true
        },
        {
          "name": "table",
          "type": "string",
          "required": true
        },
        {
          "name": "filters",
          "type": "array",
          "required": false
        },
        {
          "name": "select",
          "type": "array",
          "required": false
        },
        {
          "name": "limit",
          "type": "integer",
          "required": false
        },
        {
          "name": "offset",
          "type": "integer",
          "required": false
        }
      ],
      "result_fields": [
        "result.rows",
        "result.count"
      ],
      "error_codes": [
        "invalid_payload",
        "invalid_connection",
        "effect_claim_required",
        "test_mode_suppressed",
        "provider_unavailable",
        "invalid_provider_response",
        "response_too_large",
        "network_blocked",
        "timeout",
        "authentication_failed",
        "not_found",
        "conflict",
        "rate_limited"
      ],
      "mutates_platform": false
    },
